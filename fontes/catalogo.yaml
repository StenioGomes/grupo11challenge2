# =====================================================================
# CATÁLOGO DA BASE DE CONHECIMENTO (curadoria)
# =====================================================================
# Cada item é UM documento-fonte. O catálogo é o "contrato" da base:
# o pipeline só ingere o que está aqui, e todo chunk herda estes
# metadados. É isso que garante a RASTREABILIDADE das respostas.
#
# Campos:
#   id             identificador estável (vira nome do arquivo e metadado)
#   titulo         título oficial do documento
#   instituicao    quem publicou (autoridade da fonte)
#   ano            ano de publicação (aproximado quando a página não informa)
#   url            endereço público de onde o documento é baixado
#   alternativas   (opcional) outras URLs tentadas, em ordem, se a principal falhar
#   formato        pdf | html (formato esperado; o formato real é detectado no download)
#   idioma         pt | en
#   eixo           agrupamento temático da curadoria (ver docs/base_conhecimento.md)
#   foco_mulheres  true se o documento trata especificamente de mulheres/gênero
#   por_que        critério de inclusão (por que esta fonte está na base)
# =====================================================================

