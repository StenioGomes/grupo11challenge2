# =====================================================================
# CONJUNTO DE AVALIAÇÃO DA RECUPERAÇÃO
# =====================================================================
# Para cada pergunta, listamos as fontes (ids do catálogo) que DEVERIAM
# aparecer entre os trechos recuperados. Isso é o "gabarito" (ground truth)
# usado por avaliar.py para calcular Hit@k, MRR, Precisão e Recall de fontes.
#
# IMPORTANTE: os rótulos abaixo foram definidos a partir do tema declarado
# de cada documento. Depois da primeira ingestão, CONFIRA abrindo
# data/processed/<id>.jsonl (ou rodando consultar.py --sem-llm) se o
# conteúdo realmente está lá, e ajuste. Um gabarito errado gera métrica
# errada: avaliar o avaliador faz parte do trabalho.
# =====================================================================

